# oneJDK-25 Final #001 — Full JDK 25 Build with Static TBB Integration
#
# This workflow builds a complete JDK 25 distribution with Intel oneAPI TBB
# statically linked into libjvm. No external TBB binaries required at runtime.
#
# Key features:
# - TBB statically linked into libjvm.dll/so — zero runtime dependency
# - tbbmalloc statically linked — all HotSpot allocations use tbbmalloc
# - Shenandoah GC enabled and verified (Linux/ARM64 only — not available on Windows)
# - Full JDK images output: bin/, conf/, include/, lib/, legal/, NOTICE, release
# - Targets: Linux x64, Linux ARM64, Windows x64, Windows ARM64
#
# Build output structure (same as Adoptium/Temurin):
#   onejdk-25-*/
#   ├── bin/          # java, javac, jcmd, jstack, etc.
#   ├── conf/         # security/, security/java.security, etc.
#   ├── include/      # jni.h, jvmti.h, etc.
#   ├── lib/          # libjvm.so/dll (with TBB statically linked), src.zip, etc.
#   ├── legal/        # LICENSE, README, etc.
#   ├── NOTICE        # JDK notice file
#   └── release       # JDK release properties

name: oneJDK-25 Final #001

on:
  workflow_dispatch:
    branches: [master]

permissions:
  contents: write

jobs:
  build-jdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          # === Linux x64 ===
          - os: ubuntu-24.04
            platform: linux-x64
            artifact_name: onejdk-25-final-001-linux-x64
            tbb_version: "2022.0.0"
            shenandoah: "true"
          # === Linux ARM64 ===
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact_name: onejdk-25-final-001-linux-arm64
            tbb_version: "2022.0.0"
            shenandoah: "true"
          # === Windows x64 ===
          - os: windows-latest
            platform: windows-x64
            artifact_name: onejdk-25-final-001-windows-x64
            tbb_version: "2022.0.0"
            shenandoah: "false"
          # === Windows ARM64 ===
          - os: windows-11-arm
            platform: windows-arm64
            artifact_name: onejdk-25-final-001-windows-arm64
            tbb_version: "2022.0.0"
            shenandoah: "false"
          # === macOS x64 (Intel) — DISABLED ===
          # - os: macos-13
          #   platform: macos-x64
          #   artifact_name: onejdk-25-final-001-macos-x64
          #   tbb_version: "2022.0.0"
          #   shenandoah: "false"
          # === macOS ARM64 (Apple Silicon) — DISABLED ===
          # - os: macos-14
          #   platform: macos-arm64
          #   artifact_name: onejdk-25-final-001-macos-arm64
          #   tbb_version: "2022.0.0"
          #   shenandoah: "false"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout oneJDK-25
        uses: actions/checkout@v4
        with:
          repository: ahmetenesay/oneJDK-25
          path: jdk

      # -----------------------------------------------------------------------
      # 2. Boot JDK — must come before configure on ALL platforms
      # -----------------------------------------------------------------------
      # JDK 25 can build itself (self-hosted build).
      # Using Boot JDK 25 avoids the javac crash bug present in JDK 24.
      # Temurin JDK 25 (LTS) supports all platforms including Windows ARM64.
      - name: Set up Boot JDK (All platforms)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
        id: boot-jdk

      # Create a unified output ID for downstream steps
      - name: Set unified Boot JDK path
        shell: pwsh
        run: |
          $path = "${{ steps.boot-jdk.outputs.path }}"
          Write-Host "Boot JDK path (Temurin JDK 25): $path"
          echo "BOOT_JDK_PATH=$path" >> $env:GITHUB_ENV

      # -----------------------------------------------------------------------
      # 3. Platform build dependencies
      # -----------------------------------------------------------------------
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            autoconf make file \
            build-essential zlib1g-dev libx11-dev libxext-dev \
            libxrender-dev libxrandr-dev libxtst-dev libxt-dev \
            ccache fonts-dejavu-core libfreetype6-dev libasound2-dev \
            libpng-dev libjpeg-dev libfontconfig1-dev libcups2-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf make ccache freetype

      - name: Get MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.31.0
        with:
          install: 'autoconf tar unzip zip make'
          path-type: minimal
          release: false

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install ccache -y
        shell: pwsh

      # -----------------------------------------------------------------------
      # 4. Build/Install static TBB
      # -----------------------------------------------------------------------
      - name: Install TBB (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p jdk/tbb-static/lib jdk/tbb-static/include

          # Build TBB from source to get both static libs and headers
          echo "Building TBB from source..."
          git clone --depth 1 --branch v2021.12.0 https://github.com/uxlfoundation/oneTBB.git tbb-src
          mkdir -p tbb-src/build && cd tbb-src/build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DTBB_TEST=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-error=stringop-overflow"
          make -j$(nproc)
          cd ../..

          # Copy static libraries
          find tbb-src/build -name "libtbb*.a" -exec cp {} jdk/tbb-static/lib/ \;

          # Copy header files — critical for #include <oneapi/tbb/...>
          cp -r tbb-src/include/oneapi jdk/tbb-static/include/

          if [ -f "jdk/tbb-static/lib/libtbb.a" ] && [ -f "jdk/tbb-static/lib/libtbbmalloc.a" ]; then
            echo "✅ TBB static libraries found:"
            ls -la jdk/tbb-static/lib/libtbb*.a
          else
            echo "❌ TBB static libraries not found!"
            ls -la jdk/tbb-static/lib/ || true
            exit 1
          fi

          if [ -d "jdk/tbb-static/include/oneapi/tbb" ]; then
            echo "✅ TBB headers found:"
            ls jdk/tbb-static/include/oneapi/tbb/ | head -10
          else
            echo "❌ TBB headers not found!"
            exit 1
          fi

          echo "TBB_STATIC_LIB_DIR=$(pwd)/jdk/tbb-static/lib" >> $GITHUB_ENV
          echo "TBB_INCLUDE_DIR=$(pwd)/jdk/tbb-static/include" >> $GITHUB_ENV

      - name: Install TBB (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p jdk/tbb-static/lib jdk/tbb-static/include

          # Build TBB from source to get both static libs and headers
          echo "Building TBB from source..."
          git clone --depth 1 --branch v2021.12.0 https://github.com/uxlfoundation/oneTBB.git tbb-src
          mkdir -p tbb-src/build && cd tbb-src/build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DTBB_TEST=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-error=stringop-overflow"
          make -j$(sysctl -n hw.ncpu)
          cd ../..

          # Copy static libraries
          find tbb-src/build -name "libtbb*.a" -exec cp {} jdk/tbb-static/lib/ \;

          # Copy header files — critical for #include <oneapi/tbb/...>
          cp -r tbb-src/include/oneapi jdk/tbb-static/include/

          if [ -f "jdk/tbb-static/lib/libtbb.a" ] && [ -f "jdk/tbb-static/lib/libtbbmalloc.a" ]; then
            echo "✅ TBB static libraries found:"
            ls -la jdk/tbb-static/lib/libtbb*.a
          else
            echo "❌ TBB static libraries not found!"
            ls -la jdk/tbb-static/lib/ || true
            exit 1
          fi

          if [ -d "jdk/tbb-static/include/oneapi/tbb" ]; then
            echo "✅ TBB headers found:"
            ls jdk/tbb-static/include/oneapi/tbb/ | head -10
          else
            echo "❌ TBB headers not found!"
            exit 1
          fi

          echo "TBB_STATIC_LIB_DIR=$(pwd)/jdk/tbb-static/lib" >> $GITHUB_ENV
          echo "TBB_INCLUDE_DIR=$(pwd)/jdk/tbb-static/include" >> $GITHUB_ENV

      - name: Install TBB (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path "jdk\tbb-static\lib" -Force | Out-Null
          New-Item -ItemType Directory -Path "jdk\tbb-static\include" -Force | Out-Null

          Write-Host "Building TBB from source..."
          git clone --depth 1 --branch v2021.12.0 https://github.com/uxlfoundation/oneTBB.git tbb-src
          Set-Location tbb-src
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          Set-Location build

          # For Windows ARM64 runner, build natively; for x64 runner, build for x64
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "ARM64" } else { "x64" }
          Write-Host "Building TBB for architecture: $arch"

          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DTBB_TEST=OFF `
            -DCMAKE_CXX_FLAGS="/wd4996 /W3" -A $arch
          cmake --build . --config Release
          Set-Location ..\..

          # Copy static libraries
          Get-ChildItem -Path "tbb-src\build" -Recurse -Filter "tbb*.lib" |
            Copy-Item -Destination "jdk\tbb-static\lib\" -Force
          Get-ChildItem -Path "tbb-src\build" -Recurse -Filter "tbbmalloc*.lib" |
            Copy-Item -Destination "jdk\tbb-static\lib\" -Force

          # Copy header files — critical for #include <oneapi/tbb/...>
          Copy-Item -Path "tbb-src\include\oneapi" -Destination "jdk\tbb-static\include\" -Recurse -Force

          # oneTBB v2021.12+ names the lib tbb12.lib — create tbb.lib alias if needed
          if ((Test-Path "jdk\tbb-static\lib\tbb12.lib") -and (-not (Test-Path "jdk\tbb-static\lib\tbb.lib"))) {
            Copy-Item "jdk\tbb-static\lib\tbb12.lib" "jdk\tbb-static\lib\tbb.lib" -Force
          }

          if ((Test-Path "jdk\tbb-static\lib\tbb.lib") -and (Test-Path "jdk\tbb-static\lib\tbbmalloc.lib")) {
            Write-Host "✅ TBB static libraries found:"
            Get-ChildItem -Path "jdk\tbb-static\lib\tbb*.lib" | Select-Object Name, Length
          } else {
            Write-Host "❌ TBB static libraries not found!"
            Get-ChildItem -Path "jdk\tbb-static\lib\" -ErrorAction SilentlyContinue
            exit 1
          }

          if (Test-Path "jdk\tbb-static\include\oneapi\tbb") {
            Write-Host "✅ TBB headers found:"
            Get-ChildItem -Path "jdk\tbb-static\include\oneapi\tbb\" | Select-Object -First 10 Name
          } else {
            Write-Host "❌ TBB headers not found!"
            exit 1
          }

          $tbbLibDir = (Resolve-Path "jdk\tbb-static\lib").Path
          $tbbIncludeDir = (Resolve-Path "jdk\tbb-static\include").Path
          echo "TBB_STATIC_LIB_DIR=$tbbLibDir" >> $env:GITHUB_ENV
          echo "TBB_INCLUDE_DIR=$tbbIncludeDir" >> $env:GITHUB_ENV
        shell: pwsh

      # -----------------------------------------------------------------------
      # 5. Configure JDK
      # -----------------------------------------------------------------------
      - name: Configure JDK (Linux)
        if: runner.os == 'Linux'
        run: |
          BOOT_JDK="$BOOT_JDK_PATH"
          echo "Boot JDK: $BOOT_JDK"

          cd jdk
          chmod +x configure make/autoconf/build-aux/* 2>/dev/null || true

          EXTRA_FEATURES=""
          if [ "${{ matrix.shenandoah }}" = "true" ]; then
            EXTRA_FEATURES="--with-jvm-features=shenandoahgc,zgc"
          fi

          bash ./configure \
            --with-conf-name=onejdk-25 \
            --with-debug-level=release \
            --with-boot-jdk="$BOOT_JDK" \
            --with-jvm-variants=server \
            --with-zlib=system \
            --with-jmod-compress=zip-1 \
            --disable-warnings-as-errors \
            $EXTRA_FEATURES

          echo "=== Configure summary ==="
          grep -E "^(Build|Host|Target|Shenandoah|ZGC|Variant|Debug)" build/onejdk-25/configure-support/generated-configure.sh 2>/dev/null || \
            grep -i "shenandoah\|variant\|gc" build/onejdk-25/spec.gmk 2>/dev/null || true

          # Append TBB variables to spec.gmk so all sub-makes (including hotspot) inherit them
          echo "# oneJDK-25: TBB static linking variables (injected by workflow)" >> build/onejdk-25/spec.gmk
          echo "TBB_STATIC_LIB_DIR := $TBB_STATIC_LIB_DIR" >> build/onejdk-25/spec.gmk
          echo "TBB_INCLUDE_DIR := $TBB_INCLUDE_DIR" >> build/onejdk-25/spec.gmk
          echo "✅ TBB variables appended to spec.gmk"
          tail -5 build/onejdk-25/spec.gmk

      - name: Configure JDK (macOS)
        if: runner.os == 'macOS'
        run: |
          BOOT_JDK="$BOOT_JDK_PATH"
          echo "Boot JDK: $BOOT_JDK"

          cd jdk
          chmod +x configure make/autoconf/build-aux/* 2>/dev/null || true

          bash ./configure \
            --with-conf-name=onejdk-25 \
            --with-debug-level=release \
            --with-boot-jdk="$BOOT_JDK" \
            --with-jvm-variants=server \
            --with-jmod-compress=zip-1 \
            --disable-warnings-as-errors

          # Append TBB variables to spec.gmk so all sub-makes (including hotspot) inherit them
          echo "# oneJDK-25: TBB static linking variables (injected by workflow)" >> build/onejdk-25/spec.gmk
          echo "TBB_STATIC_LIB_DIR := $TBB_STATIC_LIB_DIR" >> build/onejdk-25/spec.gmk
          echo "TBB_INCLUDE_DIR := $TBB_INCLUDE_DIR" >> build/onejdk-25/spec.gmk
          echo "✅ TBB variables appended to spec.gmk"
          tail -5 build/onejdk-25/spec.gmk

      - name: Configure JDK (Windows)
        if: runner.os == 'Windows'
        run: |
          # Use BOOT_JDK_PATH from environment — convert to MSYS2 path
          BOOT_JDK=$(cygpath -u "$BOOT_JDK_PATH")
          echo "Boot JDK (MSYS2 path): $BOOT_JDK"

          cd jdk
          chmod +x configure make/autoconf/build-aux/* 2>/dev/null || true

          # Shenandoah is NOT supported on Windows — omit that feature flag
          bash ./configure \
            --with-conf-name=onejdk-25 \
            --with-debug-level=release \
            --with-boot-jdk="$BOOT_JDK" \
            --with-jvm-variants=server \
            --with-jmod-compress=zip-1 \
            --disable-warnings-as-errors

          echo "=== Configure done ==="

          # Append TBB variables to spec.gmk so all sub-makes (including hotspot) inherit them
          TBB_LIB_DIR=$(cygpath -u "$TBB_STATIC_LIB_DIR")
          TBB_INC_DIR=$(cygpath -u "$TBB_INCLUDE_DIR")
          echo "# oneJDK-25: TBB static linking variables (injected by workflow)" >> build/onejdk-25/spec.gmk
          echo "TBB_STATIC_LIB_DIR := $TBB_LIB_DIR" >> build/onejdk-25/spec.gmk
          echo "TBB_INCLUDE_DIR := $TBB_INC_DIR" >> build/onejdk-25/spec.gmk
          echo "✅ TBB variables appended to spec.gmk"
          tail -5 build/onejdk-25/spec.gmk

        env:
          MSYS2_PATH_TYPE: minimal
          CHERE_INVOKING: 1
        shell: msys2 {0}

      # -----------------------------------------------------------------------
      # 6. Build JDK
      # -----------------------------------------------------------------------
      - name: Build JDK with static TBB (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd jdk
          echo "TBB_STATIC_LIB_DIR: $TBB_STATIC_LIB_DIR"
          echo "TBB_INCLUDE_DIR: $TBB_INCLUDE_DIR"
          echo "TBB lib files:"
          ls -la "$TBB_STATIC_LIB_DIR/" 2>/dev/null || echo "(dir not found)"
          echo "TBB include files:"
          ls "$TBB_INCLUDE_DIR/oneapi/tbb/" 2>/dev/null | head -10 || echo "(dir not found)"
          # Boot JDK 25 is stable; use parallel build
          make images \
            TBB_STATIC_LIB_DIR="$TBB_STATIC_LIB_DIR" \
            TBB_INCLUDE_DIR="$TBB_INCLUDE_DIR" 2>&1 | tee build.log
        shell: bash

      - name: Build JDK with static TBB (Windows)
        if: runner.os == 'Windows'
        run: |
          cd jdk
          echo "TBB_STATIC_LIB_DIR: $TBB_STATIC_LIB_DIR"
          echo "TBB_INCLUDE_DIR: $TBB_INCLUDE_DIR"
          TBB_LIB_DIR=$(cygpath -u "$TBB_STATIC_LIB_DIR")
          TBB_INC_DIR=$(cygpath -u "$TBB_INCLUDE_DIR")
          echo "TBB lib dir (MSYS2): $TBB_LIB_DIR"
          echo "TBB include dir (MSYS2): $TBB_INC_DIR"
          echo "TBB lib files:"
          ls -la "$TBB_LIB_DIR/" 2>/dev/null || echo "(dir not found)"
          echo "TBB include files:"
          ls "$TBB_INC_DIR/oneapi/tbb/" 2>/dev/null | head -10 || echo "(dir not found)"
          # Boot JDK 25 is stable; use parallel build
          make images TBB_STATIC_LIB_DIR="$TBB_LIB_DIR" TBB_INCLUDE_DIR="$TBB_INC_DIR" 2>&1 | tee build.log
        env:
          MSYS2_PATH_TYPE: minimal
          CHERE_INVOKING: 1
        shell: msys2 {0}

      # -----------------------------------------------------------------------
      # 7. Verify TBB static linkage
      # -----------------------------------------------------------------------
      - name: Verify TBB is statically linked (Linux)
        if: runner.os == 'Linux'
        run: |
          cd jdk
          JVM_LIB=$(find build/onejdk-25 -name "libjvm.so" | head -1)

          if [ -f "$JVM_LIB" ]; then
            echo "Checking $JVM_LIB for TBB symbols..."
            if nm "$JVM_LIB" 2>/dev/null | grep -q "tbb"; then
              echo "✅ TBB symbols found — statically linked!"
            else
              echo "⚠️  TBB symbols not detected in nm output"
            fi
            if ldd "$JVM_LIB" 2>/dev/null | grep -q "libtbb"; then
              echo "❌ WARNING: libjvm.so still has a dynamic TBB dependency!"
            else
              echo "✅ libjvm.so has no dynamic TBB dependency — fully static!"
            fi
          else
            echo "❌ libjvm.so not found"
            find build/onejdk-25 -name "*.so" | head -10 || true
          fi

      - name: Verify TBB is statically linked (Windows)
        if: runner.os == 'Windows'
        run: |
          Set-Location jdk
          $JvmDll = Get-ChildItem -Path "build\onejdk-25" -Recurse -Filter "jvm.dll" |
                    Select-Object -First 1 -ExpandProperty FullName

          if ($JvmDll) {
            Write-Host "Checking $JvmDll for TBB dependencies..."
            $Deps = dumpbin /dependents $JvmDll 2>$null
            if ($Deps -match "tbb") {
              Write-Host "❌ WARNING: jvm.dll still depends on dynamic TBB!"
            } else {
              Write-Host "✅ jvm.dll has no dynamic TBB dependency — fully static!"
            }
          } else {
            Write-Host "❌ jvm.dll not found in build/onejdk-25"
            Get-ChildItem -Path "build\onejdk-25" -Recurse -Filter "*.dll" | Select-Object -First 10
          }
        shell: pwsh

      # -----------------------------------------------------------------------
      # 8. Verify Shenandoah GC (Linux only — not available on Windows)
      # -----------------------------------------------------------------------
      - name: Verify Shenandoah GC works
        if: runner.os == 'Linux'
        run: |
          cd jdk
          JAVA_BIN=$(find build/onejdk-25 -name "java" -type f | head -1)

          if [ -x "$JAVA_BIN" ]; then
            echo "Testing Shenandoah GC with: $JAVA_BIN"
            "$JAVA_BIN" -XX:+UseShenandoahGC -version
            echo "✅ Shenandoah GC works!"
          else
            echo "❌ java binary not found"
            find build/onejdk-25 -name "java" | head -5 || true
            exit 1
          fi
        shell: bash

      # -----------------------------------------------------------------------
      # 9. Show build output structure
      # -----------------------------------------------------------------------
      - name: Show build output structure
        run: |
          cd jdk
          BUILD_DIR=$(find build/onejdk-25 -maxdepth 0 -type d 2>/dev/null || find build -maxdepth 1 -type d | tail -1)
          echo "=== Build output structure ==="
          ls -la "$BUILD_DIR" 2>/dev/null || echo "(build dir not found)"
          echo ""
          echo "=== bin/ ==="
          ls -la "$BUILD_DIR/bin/" 2>/dev/null | head -20 || true
          echo ""
          echo "=== lib/server/ ==="
          ls -la "$BUILD_DIR/lib/server/" 2>/dev/null || true
        shell: bash

      # -----------------------------------------------------------------------
      # 10. Package & Upload
      # -----------------------------------------------------------------------
      - name: Package JDK as ZIP (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd jdk
          IMAGES_DIR=$(find build/onejdk-25/images -maxdepth 0 -type d 2>/dev/null || \
                       find build -path "*/images/jdk" -type d | head -1 | xargs dirname)
          if [ -z "$IMAGES_DIR" ]; then
            # Fallback: zip the whole onejdk-25 output dir
            IMAGES_DIR="build/onejdk-25"
          fi
          cd "$IMAGES_DIR"
          zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact_name }}.zip" .
          echo "ZIP_FILE=$GITHUB_WORKSPACE/${{ matrix.artifact_name }}.zip" >> $GITHUB_ENV
        shell: bash

      - name: Package JDK as ZIP (Windows)
        if: runner.os == 'Windows'
        run: |
          Set-Location jdk
          $ImagesDir = Get-ChildItem -Path "build\onejdk-25\images\jdk" -ErrorAction SilentlyContinue |
                       Select-Object -First 1 -ExpandProperty FullName
          if (-not $ImagesDir) {
            $ImagesDir = "build\onejdk-25"
          }
          $ZipPath = "$env:GITHUB_WORKSPACE\${{ matrix.artifact_name }}.zip"
          Compress-Archive -Path "$ImagesDir\*" -DestinationPath $ZipPath -Force
          echo "ZIP_FILE=$ZipPath" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Upload JDK ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ZIP_FILE }}
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-logs
          path: |
            jdk/build/*/configure-support/
            jdk/build/*/spec.gmk
            jdk/build/*/configure.log
            jdk/build.log
            jdk/build/*/build.log
          retention-days: 30
